<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace — Foldi</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" type="image/png" href="../public/logo-small.png">
  <style>
    /* ── Page layout ─────────────────────────────── */
    .market-page {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 96px 40px 80px;
    }

    .market-header {
      margin-bottom: 40px;
    }

    .market-header h1 {
      font-size: clamp(1.8rem, 3.5vw, 2.6rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .market-header p {
      font-size: 1rem;
      color: var(--text-secondary);
    }

    /* ── Filter bar ──────────────────────────────── */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 36px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border-radius: 10px;
      border: 1.5px solid rgba(0,0,0,0.1);
      background: white;
      flex: 1;
      min-width: 200px;
      max-width: 320px;
    }

    .search-box input {
      border: none;
      outline: none;
      font-size: 0.9rem;
      font-family: var(--font);
      color: var(--text);
      width: 100%;
      background: transparent;
    }

    .search-box input::placeholder { color: #C7C7CC; }

    .search-icon {
      color: var(--text-secondary);
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .tag-filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      flex: 1;
    }

    .tag-pill {
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      border: 1.5px solid rgba(0,0,0,0.1);
      color: var(--text-secondary);
      background: white;
      transition: all 0.15s var(--ease);
      user-select: none;
    }

    .tag-pill:hover {
      border-color: rgba(0,0,0,0.22);
      color: var(--text);
    }

    .tag-pill.active {
      background: var(--text);
      color: white;
      border-color: var(--text);
    }

    /* ── Pack grid ───────────────────────────────── */
    .packs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .pack-card {
      background: white;
      border-radius: var(--radius-sm);
      padding: 20px;
      border: 1px solid rgba(0,0,0,0.06);
      transition: box-shadow 0.2s var(--ease), transform 0.2s var(--ease);
      cursor: default;
    }

    .pack-card:hover {
      box-shadow: 0 8px 32px -8px rgba(0,0,0,0.1);
      transform: translateY(-2px);
    }

    .pack-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
    }

    .pack-name {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.015em;
      margin-bottom: 2px;
    }

    .pack-author {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .pack-icon-count {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-secondary);
      background: rgba(0,0,0,0.04);
      padding: 4px 10px;
      border-radius: 100px;
      flex-shrink: 0;
    }

    /* Icon strip */
    .pack-icons {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .pack-icon-thumb {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      object-fit: cover;
      background: rgba(0,0,0,0.03);
      border: 0.5px solid rgba(0,0,0,0.05);
      transition: transform 0.15s;
    }

    .pack-icon-thumb:hover {
      transform: scale(1.08);
    }

    .pack-icon-placeholder {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      background: rgba(0,0,0,0.04);
      border: 0.5px solid rgba(0,0,0,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pack-more-badge {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      background: rgba(0,0,0,0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    /* Tags */
    .pack-tags {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .pack-tag {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-secondary);
      background: rgba(0,0,0,0.04);
      padding: 3px 9px;
      border-radius: 100px;
    }

    /* ── Empty / loading states ──────────────────── */
    .market-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 80px 20px;
      color: var(--text-secondary);
    }

    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(0,0,0,0.08);
      border-top-color: #942A2A;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .market-empty {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-secondary);
    }

    .market-empty .empty-icon {
      font-size: 3rem;
      margin-bottom: 12px;
      opacity: 0.3;
    }

    .market-count {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    /* ── Nav additions ───────────────────────────── */
    .nav-link-subtle {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-secondary);
      transition: color 0.2s;
    }

    .nav-link-subtle:hover { color: var(--text); }

    .nav-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--text);
      color: white;
      font-size: 0.8rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
    }

    .nav-dropdown {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      background: white;
      border-radius: 12px;
      padding: 12px;
      min-width: 200px;
      box-shadow: 0 8px 32px -4px rgba(0,0,0,0.15), 0 0 0 0.5px rgba(0,0,0,0.06);
      z-index: 200;
      display: none;
    }

    .nav-dropdown.open { display: block; }

    .nav-dropdown-name {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
    }

    .nav-dropdown-email {
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .nav-dropdown-item {
      width: 100%;
      text-align: left;
      padding: 7px 4px;
      font-size: 0.85rem;
      color: var(--text-secondary);
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--font);
      border-radius: 6px;
      transition: background 0.15s;
    }

    .nav-dropdown-item:hover {
      background: rgba(0,0,0,0.04);
      color: var(--text);
    }

    .nav-links { position: relative; }

    @media (max-width: 768px) {
      .market-page { padding: 88px 20px 60px; }
      .packs-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Nav -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="../index.html" class="nav-logo">
        <img src="../public/logo.png" alt="Foldi" class="nav-icon">
        <span class="nav-wordmark">Foldi</span>
      </a>
      <div class="nav-links">
        <a href="marketplace.html" style="color:var(--text);font-weight:600;font-size:0.85rem;">Marketplace</a>
        <div id="nav-auth" style="display:contents"></div>
      </div>
    </div>
  </nav>

  <main class="market-page">
    <div class="market-header fade-in">
      <p class="section-label">🛍️ Marketplace</p>
      <h1>Browse icon packs by<br><span class="gradient-text">the community.</span></h1>
      <p>Curated packs made by designers — apply any icon to your folders in one click.</p>
    </div>

    <!-- Filter bar -->
    <div class="filter-bar fade-in" id="filter-bar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Search packs or tags…">
      </div>
      <div class="tag-filters" id="tag-filters">
        <!-- populated by JS -->
      </div>
    </div>

    <!-- Pack count -->
    <p class="market-count" id="market-count"></p>

    <!-- Packs -->
    <div id="packs-container">
      <div class="market-loading">
        <div class="loading-spinner"></div>
        <span>Loading packs…</span>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-logo">
        <img src="../public/logo.png" alt="Foldi" style="width:24px;height:24px;"> Foldi
      </div>
      <p class="footer-copy">© 2026 Foldi. All rights reserved.</p>
      <div class="footer-links">
        <a href="../index.html">Home</a>
        <a href="marketplace.html">Marketplace</a>
        <a href="https://github.com/carolyu2006/foldi">GitHub</a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/script.js"></script>
  <script>
    let allPacks = [];
    let activeTags = new Set();

    // ── Load packs ──────────────────────────────────────────────────────────
    async function load() {
      try {
        allPacks = await fetchAllPacks();
      } catch (e) {
        document.getElementById('packs-container').innerHTML = `
          <div class="market-empty">
            <div class="empty-icon">📡</div>
            <p><strong>Could not load packs</strong></p>
            <p style="font-size:0.85rem;margin-top:6px">${e.message}</p>
          </div>`;
        return;
      }
      buildTagFilters();
      renderPacks();
    }

    // ── Tag filters ─────────────────────────────────────────────────────────
    function buildTagFilters() {
      const seen = new Set();
      const tags = [];
      allPacks.forEach(p => (p.tags || []).forEach(t => {
        const l = t.toLowerCase();
        if (!seen.has(l)) { seen.add(l); tags.push(t); }
      }));

      const container = document.getElementById('tag-filters');
      container.innerHTML = '';
      tags.slice(0, 12).forEach(tag => {
        const pill = document.createElement('div');
        pill.className = 'tag-pill';
        pill.textContent = '#' + tag;
        pill.addEventListener('click', () => {
          const l = tag.toLowerCase();
          if (activeTags.has(l)) { activeTags.delete(l); pill.classList.remove('active'); }
          else { activeTags.add(l); pill.classList.add('active'); }
          renderPacks();
        });
        container.appendChild(pill);
      });
    }

    // ── Search ──────────────────────────────────────────────────────────────
    document.getElementById('search-input').addEventListener('input', renderPacks);

    // ── Render ──────────────────────────────────────────────────────────────
    function renderPacks() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();

      const filtered = allPacks.filter(pack => {
        const tags = (pack.tags || []).map(t => t.toLowerCase());

        // Tag filter
        if (activeTags.size > 0 && ![...activeTags].every(t => tags.includes(t))) return false;

        // Search filter
        if (query) {
          const haystack = [pack.name, pack.author, ...tags].join(' ').toLowerCase();
          if (!haystack.includes(query)) return false;
        }
        return true;
      });

      const count = document.getElementById('market-count');
      count.textContent = filtered.length === allPacks.length
        ? `${allPacks.length} pack${allPacks.length !== 1 ? 's' : ''}`
        : `${filtered.length} of ${allPacks.length} packs`;

      const container = document.getElementById('packs-container');

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="market-empty">
            <div class="empty-icon">🔍</div>
            <p><strong>No packs match your filters</strong></p>
            <p style="font-size:0.85rem;margin-top:6px">Try a different search or tag.</p>
          </div>`;
        return;
      }

      container.innerHTML = '';
      const grid = document.createElement('div');
      grid.className = 'packs-grid';
      filtered.forEach(pack => grid.appendChild(buildPackCard(pack)));
      container.appendChild(grid);
    }

    // ── Build pack card ─────────────────────────────────────────────────────
    function buildPackCard(pack) {
      const card = document.createElement('div');
      card.className = 'pack-card';

      const tags = (pack.tags || []).map(t =>
        `<span class="pack-tag">#${t}</span>`
      ).join('');

      // Build icon strip (lazy-loaded imgs)
      const maxShow = 5;
      const shown   = pack.icons.slice(0, maxShow);
      const extra   = pack.icons.length - maxShow;

      let iconsHtml = shown.map(path => `
        <img class="pack-icon-thumb"
             loading="lazy"
             src="${iconPublicURL(path)}"
             alt=""
             onerror="this.style.display='none'">`
      ).join('');

      if (extra > 0) {
        iconsHtml += `<div class="pack-more-badge">+${extra}</div>`;
      }

      card.innerHTML = `
        <div class="pack-card-top">
          <div>
            <div class="pack-name">${escHtml(pack.name)}</div>
            <div class="pack-author">by ${escHtml(pack.author)}</div>
          </div>
          <span class="pack-icon-count">${pack.icons.length} icon${pack.icons.length !== 1 ? 's' : ''}</span>
        </div>
        <div class="pack-icons">${iconsHtml}</div>
        <div class="pack-tags">${tags}</div>
      `;

      return card;
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Init ────────────────────────────────────────────────────────────────
    (async () => {
      await initNavAuth();
      await load();
    })();
  </script>
</body>
</html>
