<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foldi</title>
  <link rel="icon" type="image/png" href="../public/images/favicon.png">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <!-- Nav -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="../index.html" class="nav-logo">
        <img src="../public/images/nav-logo.png" alt="Foldi" class="nav-icon">
      </a>
      <div class="nav-links" style="position:relative">
        <a href="marketplace.html">Gallery</a>
        <a href="creators.html">Creators</a>
        <a href="../index.html#download">Download App</a>
        <a href="auth.html" class="nav-cta">Join Foldi</a>
      </div>
    </div>
  </nav>

  <main class="main-section admin-page">
    <div class="admin-header">
      <p class="section-label">Admin</p>
      <h1>Moderation Queue</h1>
      <p>Review and approve or reject submitted icon packs.</p>
    </div>

    <!-- Service key gate -->
    <div id="key-gate" class="key-gate">
      <h2>Admin Access</h2>
      <p>Enter your Supabase service role key to access the moderation panel.<br>
         Find it in your Supabase project under Settings → API.</p>
      <input class="key-input" type="password" id="key-input"
             placeholder="service_role key" autocomplete="off">
      <div class="key-error" id="key-error"></div>
      <button class="btn btn-primary" id="key-submit" style="width:100%">Unlock</button>
    </div>

    <!-- Admin panel (shown after key verified) -->
    <div id="admin-panel" style="display:none">
      <div class="filter-row">
        <button class="filter-btn active" data-status="pending">Pending</button>
        <button class="filter-btn" data-status="all">All</button>
        <button class="filter-btn" data-status="approved">Approved</button>
        <button class="filter-btn" data-status="rejected">Rejected</button>
        <button class="refresh-btn" id="refresh-btn">Refresh</button>
      </div>

      <div id="pack-list" class="pack-list"></div>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script>
    let serviceKey = sessionStorage.getItem('foldi_admin_key') || '';
    let currentFilter = 'pending';
    let allPacks = [];

    // ── Key gate ────────────────────────────────────────────────────────────
    if (serviceKey) {
      unlockPanel();
    }

    document.getElementById('key-submit').addEventListener('click', () => {
      const val = document.getElementById('key-input').value.trim();
      if (!val) {
        document.getElementById('key-error').textContent = 'Please enter the service role key.';
        return;
      }
      serviceKey = val;
      sessionStorage.setItem('foldi_admin_key', serviceKey);
      unlockPanel();
    });

    document.getElementById('key-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('key-submit').click();
    });

    async function unlockPanel() {
      document.getElementById('key-error').textContent = '';
      try {
        // Verify key works by fetching all packs
        allPacks = await fetchAllPacks({ approvedOnly: false, serviceKey });
        document.getElementById('key-gate').style.display = 'none';
        document.getElementById('admin-panel').style.display = '';
        renderList();
      } catch (e) {
        serviceKey = '';
        sessionStorage.removeItem('foldi_admin_key');
        document.getElementById('key-error').textContent =
          'Invalid key or network error. Check the key and try again.';
      }
    }

    // ── Filters ─────────────────────────────────────────────────────────────
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.status;
        renderList();
      });
    });

    document.getElementById('refresh-btn').addEventListener('click', async () => {
      try {
        allPacks = await fetchAllPacks({ approvedOnly: false, serviceKey });
        renderList();
        showToast('Refreshed');
      } catch (e) {
        showToast('Refresh failed: ' + e.message, true);
      }
    });

    // ── Render ───────────────────────────────────────────────────────────────
    function renderList() {
      const list = document.getElementById('pack-list');
      const filtered = currentFilter === 'all'
        ? allPacks
        : allPacks.filter(p => p.status === currentFilter);

      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="state-message">
            <div class="state-icon" style="width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,0.05);margin:0 auto 10px"></div>
            <div>No ${currentFilter === 'all' ? '' : currentFilter + ' '}packs found.</div>
          </div>`;
        return;
      }

      list.innerHTML = '';
      filtered.forEach(pack => {
        const card = buildCard(pack);
        list.appendChild(card);
      });
    }

    function buildCard(pack) {
      const card = document.createElement('div');
      card.className = 'pack-card';
      card.id = `pack-${pack.id}`;

      // Thumbnails (up to 3)
      const thumbs = (pack.icons || []).slice(0, 3).map(path => {
        const url = iconPublicURL(path);
        return `<img class="pack-thumb" src="${escHtml(url)}" alt="" loading="lazy"
                     onerror="this.style.display='none'">`;
      });
      while (thumbs.length < 3) {
        thumbs.push(`<div class="pack-thumb-placeholder"></div>`);
      }

      const tags = (pack.tags || []).map(t =>
        `<span class="pack-tag">#${escHtml(t)}</span>`
      ).join('');

      const isPending  = pack.status === 'pending';
      const isApproved = pack.status === 'approved';
      const isRejected = pack.status === 'rejected';

      card.innerHTML = `
        <div class="pack-thumbs">${thumbs.join('')}</div>
        <div class="pack-info">
          <div class="pack-title-row">
            <div class="pack-name">${escHtml(pack.name)}</div>
            <span class="status-badge ${escHtml(pack.status)}">${escHtml(pack.status)}</span>
          </div>
          <div class="pack-meta">by ${escHtml(pack.author)} &middot; ${pack.icons?.length ?? 0} icons</div>
          ${tags ? `<div class="pack-tags">${tags}</div>` : ''}
        </div>
        <div class="pack-actions">
          <button class="action-btn btn-approve" data-id="${escHtml(String(pack.id))}"
                  ${isApproved ? 'disabled' : ''}>Approve</button>
          <button class="action-btn btn-reject"  data-id="${escHtml(String(pack.id))}"
                  ${isRejected ? 'disabled' : ''}>Reject</button>
        </div>`;

      card.querySelector('.btn-approve').addEventListener('click', () => setStatus(pack.id, 'approved', card));
      card.querySelector('.btn-reject').addEventListener('click', () => setStatus(pack.id, 'rejected', card));

      return card;
    }

    // ── Status update ────────────────────────────────────────────────────────
    async function setStatus(packId, status, card) {
      const btns = card.querySelectorAll('.action-btn');
      btns.forEach(b => b.disabled = true);

      try {
        await updatePackStatus(packId, status, serviceKey);

        // Update local state
        const pack = allPacks.find(p => p.id === packId);
        if (pack) pack.status = status;

        // Update badge in-place
        const badge = card.querySelector('.status-badge');
        badge.className = `status-badge ${status}`;
        badge.textContent = status;

        // Re-enable correct button
        const approveBtn = card.querySelector('.btn-approve');
        const rejectBtn  = card.querySelector('.btn-reject');
        approveBtn.disabled = status === 'approved';
        rejectBtn.disabled  = status === 'rejected';

        showToast(status === 'approved' ? 'Pack approved ✓' : 'Pack rejected');
      } catch (e) {
        btns.forEach(b => b.disabled = false);
        showToast('Error: ' + e.message, true);
      }
    }

    // ── Toast ────────────────────────────────────────────────────────────────
    let toastTimer;
    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast show' + (isError ? ' error' : '');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.className = 'toast';
      }, 2800);
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
</html>
