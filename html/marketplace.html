<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foldi</title>
  <link rel="icon" type="image/png" href="../public/images/favicon.png">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/marketplace.css">
</head>
<body>

  <!-- Nav -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="../index.html" class="nav-logo">
        <img src="../public/images/nav-logo.png" alt="Foldi" class="nav-icon">
      </a>
      <div class="nav-links" style="position:relative">
        <a href="marketplace.html">Gallery</a>
        <a href="creators.html">Creators</a>
        <a href="../index.html#download">Download App</a>
        <a href="auth.html" class="nav-cta">Join Foldi</a>
      </div>
    </div>
  </nav>

  <main class="main-section market-page">
    <div class="market-header fade-in">
      <p class="section-label">Marketplace</p>
      <h1>Browse icon packs by<br>the community.</h1>
      <p>Curated packs made by designers — apply any icon to your folders in one click.</p>
    </div>

    <!-- Filter bar -->
    <div class="filter-bar fade-in" id="filter-bar">
      <div class="search-box">
        <span class="search-icon">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.5" stroke="#9CA3AF" stroke-width="1.5"/><path d="M10 10l2.5 2.5" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round"/></svg>
        </span>
        <input type="text" id="search-input" placeholder="Search packs or tags…">
      </div>
      <div class="tag-filters" id="tag-filters">
        <!-- populated by JS -->
      </div>
    </div>

    <!-- Pack count -->
    <p class="market-count" id="market-count"></p>

    <!-- Packs -->
    <div id="packs-container">
      <div class="market-loading">
        <div class="loading-spinner"></div>
        <span>Loading packs…</span>
      </div>
    </div>
  </main>
  <!-- Footer -->
  <!-- Footer -->
  <footer class="footer">
    <div class="footer-inner">
      <a href="../index.html" class="footer-logo">
        <img src="../public/images/nav-logo.png" alt="Foldi" class="footer-nav-icon">
      </a>
      <p class="footer-copy">&copy; 2026 Foldi. All rights reserved.</p>
      <div class="footer-social">
        <a href="https://github.com/carolyu2006/foldi" class="footer-social-link" aria-label="GitHub" target="_blank" rel="noopener">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-.868-.013-1.703-2.782.604-3.369-1.342-3.369-1.342-.454-1.154-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836a9.59 9.59 0 012.504.337c1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.202 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.741 0 .267.18.579.688.481C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/></svg>
        </a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/script.js"></script>
  <script>
    let allPacks = [];
    let activeTags = new Set();

    // ── Load packs ──────────────────────────────────────────────────────────
    async function load() {
      try {
        allPacks = await fetchAllPacks();
      } catch (e) {
        document.getElementById('packs-container').innerHTML = `
          <div class="market-empty">
            <div class="empty-icon" style="width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,0.05);margin:0 auto 12px"></div>
            <p><strong>Could not load packs</strong></p>
            <p style="font-size:0.85rem;margin-top:6px">${e.message}</p>
          </div>`;
        return;
      }
      buildTagFilters();
      renderPacks();
    }

    // ── Tag filters ─────────────────────────────────────────────────────────
    function buildTagFilters() {
      const seen = new Set();
      const tags = [];
      allPacks.forEach(p => (p.tags || []).forEach(t => {
        const l = t.toLowerCase();
        if (!seen.has(l)) { seen.add(l); tags.push(t); }
      }));

      const container = document.getElementById('tag-filters');
      container.innerHTML = '';
      tags.slice(0, 12).forEach(tag => {
        const pill = document.createElement('div');
        pill.className = 'tag-pill';
        pill.textContent = '#' + tag;
        pill.addEventListener('click', () => {
          const l = tag.toLowerCase();
          if (activeTags.has(l)) { activeTags.delete(l); pill.classList.remove('active'); }
          else { activeTags.add(l); pill.classList.add('active'); }
          renderPacks();
        });
        container.appendChild(pill);
      });
    }

    // ── Search ──────────────────────────────────────────────────────────────
    document.getElementById('search-input').addEventListener('input', renderPacks);

    // ── Render ──────────────────────────────────────────────────────────────
    function renderPacks() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();

      const filtered = allPacks.filter(pack => {
        const tags = (pack.tags || []).map(t => t.toLowerCase());

        // Tag filter
        if (activeTags.size > 0 && ![...activeTags].every(t => tags.includes(t))) return false;

        // Search filter
        if (query) {
          const haystack = [pack.name, pack.author, ...tags].join(' ').toLowerCase();
          if (!haystack.includes(query)) return false;
        }
        return true;
      });

      const count = document.getElementById('market-count');
      count.textContent = filtered.length === allPacks.length
        ? `${allPacks.length} pack${allPacks.length !== 1 ? 's' : ''}`
        : `${filtered.length} of ${allPacks.length} packs`;

      const container = document.getElementById('packs-container');

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="market-empty">
            <div class="empty-icon" style="width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,0.05);margin:0 auto 12px"></div>
            <p><strong>No packs match your filters</strong></p>
            <p style="font-size:0.85rem;margin-top:6px">Try a different search or tag.</p>
          </div>`;
        return;
      }

      container.innerHTML = '';
      const grid = document.createElement('div');
      grid.className = 'packs-grid';
      filtered.forEach(pack => grid.appendChild(buildPackCard(pack)));
      container.appendChild(grid);
    }

    // ── Build pack card ─────────────────────────────────────────────────────
    function buildPackCard(pack) {
      const card = document.createElement('div');
      card.className = 'pack-card';

      const tags = (pack.tags || []).map(t =>
        `<span class="pack-tag">#${t}</span>`
      ).join('');

      // Build icon strip (lazy-loaded imgs)
      const maxShow = 5;
      const shown   = pack.icons.slice(0, maxShow);
      const extra   = pack.icons.length - maxShow;

      let iconsHtml = shown.map(path => `
        <img class="pack-icon-thumb"
             loading="lazy"
             src="${iconPublicURL(path)}"
             alt=""
             onerror="this.style.display='none'">`
      ).join('');

      if (extra > 0) {
        iconsHtml += `<div class="pack-more-badge">+${extra}</div>`;
      }

      card.innerHTML = `
        <div class="pack-card-top">
          <div>
            <div class="pack-name">${escHtml(pack.name)}</div>
            <div class="pack-author">by ${escHtml(pack.author)}</div>
          </div>
          <span class="pack-icon-count">${pack.icons.length} icon${pack.icons.length !== 1 ? 's' : ''}</span>
        </div>
        <div class="pack-icons">${iconsHtml}</div>
        <div class="pack-tags">${tags}</div>
      `;

      return card;
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Init ────────────────────────────────────────────────────────────────
    (async () => {
      await initNavAuth();
      await load();
    })();
  </script>
</body>
</html>
